version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: starpoint_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 161005
      MYSQL_DATABASE: starpoint_db
      MYSQL_USER: starpoint_user
      MYSQL_PASSWORD: 161005
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: starpoint_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: starpoint_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: starpoint_backend
    restart: always
    environment:
      DATABASE_URL: mysql://starpoint_user:161005@mysql:3306/starpoint_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: supersecretjwtkeyhere123456789!
      JWT_REFRESH_SECRET: supersecretrefreshjwtkeyhere987654321!
      JWT_EXPIRATION: 3600
      JWT_REFRESH_EXPIRATION: 604800
      PORT: 3000
      # SMTP mail settings for password resets
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM:-"StarPoint Support <noreply@starpoint.edu.vn>"}
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - uploads_data:/usr/src/app/backend/uploads
    command: sh -c "cd backend && npx prisma migrate deploy && npx prisma db seed && cd .. && node backend/dist/src/main"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: starpoint_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
